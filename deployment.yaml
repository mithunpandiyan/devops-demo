apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-demo
  template:
    metadata:
      labels:
        app: devops-demo
    spec:
      containers:
        - name: app
          image: mithosoft/devops-demo:doesnotexist
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-demo
spec:
  type: NodePort
  selector:
    app: devops-demo
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080